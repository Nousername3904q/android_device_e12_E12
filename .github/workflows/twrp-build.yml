name: Compile TWRP Recovery Image
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Freeing Up Server Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d/* /usr/local/lib/android
        sudo apt-get clean

    - name: Set Up Building Packages
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 cpio

    - name: Fetch and Configure Stable Repo Launcher
      run: |
        mkdir -p ~/bin
        curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
        chmod a+x ~/bin/repo
        sudo cp ~/bin/repo /usr/local/bin/repo

    - name: Initialize TWRP Workspace & Sync
      run: |
        mkdir -p ~/workspace && cd ~/workspace
        git config --global user.email "git@github.com"
        git config --global user.name "GitHub Action"
        /usr/local/bin/repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
        /usr/local/bin/repo sync -c -j$(nproc) --no-tags --no-clone-bundle

    - name: Clone Local Device Tree
      run: |
        cd ~/workspace
        git clone https://github.com/Nousername3904q/android_device_e12_E12.git device/e12/E12

    - name: Apply Modern Device-Mapper Bugfix
      run: |
        cd ~/workspace
        sed -i 's/libdm/libdm_twrp/g' system/core/fs_mgr/libdm/Android.bp || true

    - name: Compile TWRP Image
      run: |
        cd ~/workspace
        export ALLOW_MISSING_DEPENDENCIES=true
        . build/envsetup.sh
        lunch omni_E12-eng
        make recoveryimage -j$(nproc)

    - name: Upload Completed TWRP File
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-E12-Recovery
        path: /home/runner/workspace/out/target/product/E12/*.img
